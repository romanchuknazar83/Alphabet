<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet - Text & Audio Extractor</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #2563eb;
            --text-color: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h1 { 
            text-align: center; 
            font-size: 2rem; 
            margin-bottom: 20px; 
            letter-spacing: 2px;
        }
        /* Стилі для різнокольорових літер */
        .letter-a1 { color: #ef4444; } /* Червоний */
        .letter-l  { color: #f59e0b; } /* Помаранчевий */
        .letter-p  { color: #10b981; } /* Зелений */
        .letter-h  { color: #06b6d4; } /* Блакитний */
        .letter-a2 { color: #3b82f6; } /* Синій */
        .letter-b  { color: #8b5cf6; } /* Фіолетовий */
        .letter-e  { color: #ec4899; } /* Рожевий */
        .letter-t  { color: #f43f5e; } /* Малиновий */

        .section { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.9rem; }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:disabled { background-color: #9ca3af; }
        .ad-banner {
            margin-top: 30px;
            width: 100%;
            max-width: 500px;
            height: 90px;
            background-color: #e5e7eb;
            border: 2px dashed #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 0.85rem;
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>
        📚 
        <span class="letter-a1">A</span><span class="letter-l">L</span><span class="letter-p">P</span><span class="letter-h">H</span><span class="letter-a2">A</span><span class="letter-b">B</span><span class="letter-e">E</span><span class="letter-t">T</span>
    </h1>
    
    <!-- Вибір фото -->
    <div class="section">
        <label for="fileInput">Виберіть фото (максимум 10 фото):</label>
        <input type="file" id="fileInput" multiple accept="image/*">
        <small id="limitNotice" style="color: #2563eb; display:block; margin-top:4px;">
            Рекомендовано: до 10 фото за один раз для комфортної роботи.
        </small>
    </div>

    <button id="processBtn" onclick="processImages()">Обробити та завантажити файли</button>
</div>

<!-- Рекламний блок -->
<div class="ad-banner">
    Партнерський блок / Реклама мовних шкіл
</div>

<script>
    function processImages() {
        const files = document.getElementById('fileInput').files;

        if (files.length === 0) {
            alert('Виберіть хоча б одне фото!');
            return;
        }

        if (files.length > 10) {
            alert('Будь ласка, виберіть не більше 10 фотографій за один раз для стабільної роботи.');
            return;
        }

        alert(`Розпочато обробку ${files.length} фото.`);
    }
</script>

</body>
</html>
